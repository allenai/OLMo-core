version: v2
description: Nsight Systems profile of random-init Olmo hybrid KDA/MoE training in OLMo-core
budget: ai2/oe-other
tasks:
  - name: profile
    image:
      beaker: akshitab/olmo-core-tch2110cu130-fa4-rma-2026-07-24
    command: [bash, -lc]
    arguments:
      - |
        set -euo pipefail
        git clone \
          --branch robertb/kda-nsys-profile --single-branch \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/allenai/OLMo-core.git" \
          /src/OLMo-core
        export PYTHONPATH="/src/OLMo-core/src:${PYTHONPATH:-}"
        export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
        export OLMO_SHARED_FS=1
        NSYS_DEB=/tmp/nsight-systems.deb
        curl -fsSL \
          https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/nsight-systems-2026.1.3_2026.1.3.425-1_amd64.deb \
          -o "${NSYS_DEB}"
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${NSYS_DEB}"
        rm -f "${NSYS_DEB}"
        rm -rf /var/lib/apt/lists/*

        dpkg-query -W 'nsight-systems*' | tee /results/nsight-packages.txt
        NSYS_BIN=$(find /opt -type f -name nsys -perm /111 2>/dev/null | head -n 1)
        test -n "${NSYS_BIN}"
        export PATH="$(dirname "${NSYS_BIN}"):${PATH}"
        printf '%s\n' "${NSYS_BIN}" | tee /results/nsys-path.txt
        nsys --version | tee /results/nsys-version.txt
        git -C /src/OLMo-core rev-parse HEAD | tee /results/olmo-core-commit.txt
        python - <<'PY' | tee /results/environment.txt
        import fla
        import nvtx
        import torch

        print("torch", torch.__version__)
        print("fla", getattr(fla, "__version__", "unknown"))
        print("nvtx", nvtx.__file__)
        print("cuda", torch.version.cuda)
        PY
        printf '%s\n' \
          'KDA tests: 4 passed on this source revision before the launcher-only extension fix.' \
          'Validation experiment: 01M0C718TZD22T6F0V1FBF4G9A' \
          | tee /results/kda-tests.txt
        python -m olmo_core.kernels.build_symm_mem_vdev2d_ext \
          --inplace --backend cmake 2>&1 | tee /results/symm-mem-build.txt

        SOURCE_CONFIG=/weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/midtraining/mt-1p2b-kda-ev2-neg-nope-gated-latentmoe-l2-paper-cx8-samebatch-lr1p6e-4-r1/step63802/config.json
        RUN_DIR="/weka/oe-training-default/robertb/olmo-megatron/profile-olmo-core-${BEAKER_EXPERIMENT_ID}"
        DATA_FILE="${RUN_DIR}/random-tokens.npy"
        mkdir -p "${RUN_DIR}"
        test -f "${SOURCE_CONFIG}"
        python - "${DATA_FILE}" <<'PY'
        import sys

        import numpy as np

        output = sys.argv[1]
        tokens = np.random.default_rng(1234).integers(0, 100278, size=5_000_000, dtype=np.uint32)
        np.save(output, tokens)
        PY

        torchrun --standalone --nproc-per-node=8 --no-python \
          /src/OLMo-core/scripts/nsys-profile-rank.sh \
            /results/olmo-core-hybrid-kda-moe \
            python /src/OLMo-core/src/examples/olmo_ddp/profile_hybrid_kda_moe.py \
            --config "${SOURCE_CONFIG}" \
            --data "${DATA_FILE}" \
            --output-dir "${RUN_DIR}" \
            --steps 13 \
            --profile-step-start 10 \
            --profile-step-end 13 \
            --sequence-length 8192 \
            --micro-batch-size 3 \
            --gradient-accumulation-steps 8 \
            2>&1 | tee /results/train.log

        nsys stats --report cuda_gpu_kern_sum,nvtx_sum,cuda_api_sum \
          /results/olmo-core-hybrid-kda-moe-rank-0.nsys-rep \
          > /results/nsys-stats.txt
        nsys export --type sqlite --force-overwrite=true \
          --output /results/olmo-core-hybrid-kda-moe-rank-0.sqlite \
          /results/olmo-core-hybrid-kda-moe-rank-0.nsys-rep
        cp "${RUN_DIR}/config.json" /results/config.json
    envVars:
      - name: GITHUB_TOKEN
        secret: robertb_GITHUB_TOKEN
    datasets:
      - mountPath: /weka/oe-training-default
        source:
          weka: oe-training-default
    result:
      path: /results
    resources:
      gpuCount: 8
      sharedMemory: 100 GiB
    context:
      priority: urgent
      preemptible: true
    constraints:
      cluster: [ai2/holmes]
