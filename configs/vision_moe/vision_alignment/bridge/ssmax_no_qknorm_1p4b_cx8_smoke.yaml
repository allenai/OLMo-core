version: 1
name: vision-ssmax-no-qknorm-1p4b-cx8-bridge-smoke
description: >-
  Paired synthetic one-step 2x8 HSDP mechanics smoke for the 1.4B Cx8 Scalable-Softmax
  parent without QK RMSNorm. This is not model-quality evidence.
phase: bridge
launch:
  cluster: ai2/holmes
  workspace: ai2/scaling-ladders
  budget: ai2/oe-other
  num_nodes: 2
  num_gpus: 8
  priority: urgent
  min_runtime: 8h
overrides:
  - --model_variant=ssmax_no_qknorm
  - --data.pixmo_cap_path=synthetic
  - --data.allow_unpinned_synthetic_smoke=true
  - --data.mixture.mean_loss_weight.pixmo_caption=11.17857351899147
  - --data.mixture.mean_loss_weight.pixmo_transcript=11.178573459386826
  - --trainer.max_duration.value=1
  - --trainer.callbacks.checkpointer.save_interval=1
  - --trainer.callbacks.checkpointer.ephemeral_save_interval=null
  - --evaluation.interval=null
  - --data.prefetch_workers=0
