version: 1
name: vision-alignment-bridge-real-v1
description: >-
  Fresh 500-step connector-only extension of the proven bridge schedule. It exactly reproduces
  the canary cosine decay through step 250, then holds the 2e-5 floor while preserving permanent
  checkpoints for matched wrong-image evaluation.
phase: bridge
launch:
  cluster: ai2/holmes
  workspace: ai2/molmofication
  budget: ai2/oe-other
  num_nodes: 2
  num_gpus: 8
  priority: urgent
  min_runtime: 8h
overrides:
