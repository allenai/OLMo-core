  - --data.source_audit_path=/weka/oe-training-default/rustin/experiments/vision-moe/vision-alignment/artifacts/bridge-source-audit-v1.json
  - --data.source_audit_fingerprint=6d49234bb6233e9ce6a4becec04de6c068f3cb3fd1cfddb71a219b88fce4b3a0
  - --data.mixture.mean_loss_weight.pixmo_caption=29.144221610185923
