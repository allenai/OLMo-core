version: 1
name: stage1-ep8-2node-real-resume-2step
description: >-
  Resume the successful real-data Stage-1 gate from step 1, restore full trainer and
  optimizer state, execute step 2, and write the result to a separate run folder.
launch:
  num_nodes: 2
  num_gpus: 8
  workspace: ai2/molmofication
  cluster: ai2/holmes
  budget: ai2/oe-other
  priority: urgent
  min_runtime: null
overrides:
  - --trainer.load_path=/weka/oe-training-default/rustin/experiments/vision-moe/checkpoints/s002-stage1-real-gate-checkpointfix-nominruntime-20260805/step1
  - --trainer.load_strategy=always
  - --trainer.load_optim_state=true
  - --trainer.load_trainer_state=true
  - --trainer.max_duration.value=2
  - --trainer.max_duration.unit=steps
  - --trainer.callbacks.wandb.enabled=false
  - --trainer.callbacks.checkpointer.pre_train_checkpoint=false
  - --trainer.callbacks.checkpointer.save_interval=2
  - --trainer.callbacks.checkpointer.ephemeral_save_interval=null
  - --trainer.callbacks.checkpointer.max_checkpoints=1
