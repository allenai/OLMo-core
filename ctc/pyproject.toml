[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctc"
version = "0.1.0"
description = "Corpus-reasoning task generation and evaluation. Independent of olmo-core."
readme = "README.md"
requires-python = ">=3.10"

# INTENTIONALLY EMPTY. Every heavy dependency is an extra.
#
# This is the load-bearing line of the whole package: `pip install ./ctc` must work on a machine
# with no GPU, no CUDA toolkit, and no compiler, so that generating task data and grading a
# checkpoint never requires building a training environment. 51 of our 56 task generators are pure
# Python, and no file under `ctc/data/` imports torch, transformers, or olmo_core.
dependencies = []

[project.optional-dependencies]
# Secondary clustering/ordering metrics (ARI, NMI, spearman). The PRIMARY metrics --
# pairwise-F1 and kendall-tau -- are pure Python and pinned against these libraries in the
# golden fixture, so a bare install still produces the headline numbers.
stats = ["scikit-learn", "scipy"]
# ROUGE for summarization. NOT optional in practice: without it summarization refuses to score
# rather than silently substituting token-F1, which is what corrupted the published helmet_summ
# column. absl-py is listed explicitly because rouge_score imports fine without it and fails later.
rouge = ["rouge_score", "absl-py", "nltk"]
# Task sources that pull real corpora (BEIR, MS MARCO, HotpotQA, PubMed, ...).
sources = ["datasets", "tqdm"]
# Generators that need a tokenizer to fit ladder rungs, or a cross-encoder to filter hard negatives.
gen = ["transformers", "torch"]
# Eval backends. Exactly one of these is needed to grade a checkpoint.
hf = ["transformers", "torch"]
vllm = ["vllm"]
native = ["ai2-olmo-core"]
all = ["ctc[sources,gen,hf,vllm,native]"]
dev = ["pytest"]

[project.scripts]
ctc-data = "ctc.data.cli:main"
ctc-eval = "ctc.eval.cli:main"
ctc-fingerprint = "ctc.format.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
# src/ctc/format/prompts.py is excluded on purpose. Its string literals ARE the training data --
# every checkpoint we have is bound to them. The file was copied verbatim from the pre-migration
# source so that a diff against the frozen `pre-migration-source` tag shows zero drift, and that
# check is worth more than uniform formatting here. Reformatting could not change a string's VALUE,
# but it would end the property that makes the drift check a one-liner.
#
# The same exclusion is repeated in the repo-root pyproject.toml: black picks its config by walking
# up from the files it was given, so `black ctc/` reads THIS file while `make style` (which runs
# `black .` from the root) reads that one. Only having it here would silently do nothing.
force-exclude = 'src/ctc/format/prompts\.py'

[tool.isort]
profile = "black"
line_length = 100
# olmo_core is first-party in this monorepo even though ctc depends on it only via the `native`
# extra. Declared so that formatting a file under ctc/ gives the same result whether isort resolved
# this config or the repo-root one -- otherwise the import order churns on every invocation.
known_first_party = ["ctc", "olmo_core"]
skip_glob = ["src/ctc/format/prompts.py"]
