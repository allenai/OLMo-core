[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2-olmo-core"
dynamic = ["version"]
readme = "README.md"
description = "Core training module for the Open Language Model (OLMo)"
authors = [
    { name = "Allen Institute for Artificial Intelligence", email = "olmo@allenai.org" },
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "torch>=2.6.0",
    "cached-path>=1.7.2",
    "filelock>=3.4,<4.0",
    "requests",
    "packaging",
    "dataclass-extensions>=0.3.0",
    "pyyaml",
    "rich",
    "safetensors",
    "importlib_resources",
    "bettermap",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/allenai/OLMo-core"
Documentation = "https://olmo-core.readthedocs.io/en/latest/"
Changelog = "https://github.com/allenai/OLMo-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "black>=23.1,<24.0",
    "boto3",
    "build",
    "furo==2024.8.6",
    "google-cloud-storage",
    "isort>=5.12,<5.14",
    "matplotlib",
    "mypy>=1.0,<1.4",
    "myst-parser>=1.0,<3.0",
    "pytest",
    "pytest-memray",
    "pytest-sphinx",
    "pytest-xdist",
    "ruff==0.15.9",
    "setuptools",
    "Sphinx>=6.0,<=8.1.3",
    "sphinx-autobuild",
    "sphinx-autodoc-typehints==1.23.3",
    "sphinx-copybutton",
    "sphinx-inline-tabs",
    "twine>=1.11.0",
    "wheel",
]
beaker = ["beaker-py>=2.5.4,<3.0", "beaker-gantry>=3.4.3,<4.0", "GitPython>=3.0,<4.0", "google-cloud-compute"]
comet = ["comet_ml"]
dion = ["dion @ git+https://github.com/microsoft/dion.git@7452a5823cf9655b93c3f1d8020b4ebb2535239b ; sys_platform == 'linux'"]
eval = ["ai2-olmo-eval==0.9.0"]
fa4 = [
    "flash-attn-4>=4.0.0b4 ; sys_platform == 'linux'",
    # quack-kernels (pulled in by flash-attn-4's `cute` path) references
    # `cutlass.cute.core.ThrMma`, which nvidia-cutlass-dsl removed in 4.6.0. Pin below that until
    # quack-kernels supports 4.6+, otherwise importing flash_attn.cute raises AttributeError and
    # breaks `import olmo_core.nn`.
    "nvidia-cutlass-dsl<4.6.0 ; sys_platform == 'linux'",
]
# Match the dense ladder's current OLMo Core dependency. The MoE ladder validates
# this against its Torch 2.11 / CUDA 13 Beaker image before production use.
fla = ["flash-linear-attention==0.5.2"]
profiling = ["nvtx"]
torchao = ["torchao==0.15.0"]
transformers = ["transformers>=5.4.0"]
wandb = ["wandb"]
all = ["ai2-olmo-core[dev,beaker,comet,dion,eval,fa4,fla,profiling,torchao,transformers,wandb]"]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
olmo_core = [
    "py.typed",
    "*.txt",
    "nn/_csrc/*.cpp",
    "kernels/cuda/*.cpp",
    "kernels/cuda/*.cu",
    "kernels/cuda/*.cuh",
    "kernels/cuda/*.h",
    "kernels/cuda/CMakeLists.txt",
]

[tool.setuptools.dynamic]
version = { attr = "olmo_core.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["olmo_core*"]
exclude = []

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
    | scratch/
    | src/olmo_core/kernel_fun/(_common|kda|cconv)/
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
extend_skip_glob = [
    "src/olmo_core/kernel_fun/_common/*",
    "src/olmo_core/kernel_fun/kda/*",
    "src/olmo_core/kernel_fun/cconv/*",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    # Vendored verbatim from the kernel-fun package (see the olmo_core.kernel_fun package
    # docstring). These are excluded from isort/black/ruff/mypy rather than fixed in place:
    # they are 90-column upstream, and any reformatting here is lost on the next vendor and
    # turns the next diff into noise. Fixes belong upstream, where a bench row can check them.
    "src/olmo_core/kernel_fun/_common",
    "src/olmo_core/kernel_fun/kda",
    "src/olmo_core/kernel_fun/cconv",
]

[tool.ruff.lint]
ignore = ["F403", "F405", "E501"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".venv",
    "venv",
    ".mypy_cache",
    "__pycache__",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "doc",
    "pretrain_data",
    "inference",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
reportPrivateImportUsage = false

[tool.ty.rules]
possibly-missing-attribute = "ignore"
possibly-missing-import = "ignore"
unresolved-attribute = "warn"

[[tool.ty.overrides]]
include = ["src/olmo_core/nn/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
namespace_packages = false
disable_error_code = "has-type"

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[[tool.mypy.overrides]]
# The vendored kernel-fun kernels: CuTe DSL metaclass-generated attributes and DSL-typed
# unpacking that mypy cannot follow. This lives here rather than as an in-file
# `# mypy: ignore-errors` header because those files are copied byte-for-byte from the
# package and an in-file edit would be lost on the next vendor.
module = "olmo_core.kernel_fun.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = "src/test/"
python_classes = ["Test*", "*Test"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
log_cli = false
log_cli_level = "DEBUG"
markers = ["gpu"]
filterwarnings = [
    'ignore::FutureWarning:huggingface_hub\.file_download',
    'ignore::DeprecationWarning:pkg_resources',
    'ignore::DeprecationWarning:google\.rpc',
    'ignore::DeprecationWarning:torchao\.dtypes.*',
    'ignore::FutureWarning:torch\.distributed\.checkpoint\.default_planner',
    'ignore::UserWarning:torch\.distributed\.checkpoint\.state_dict_saver',
    'ignore::UserWarning:torch\.distributed\.checkpoint\.state_dict_loader',
]
