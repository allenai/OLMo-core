name: Main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

env:
  # Change this to invalidate existing cache.
  CACHE_PREFIX: v1
  PYTHONPATH: ./src/
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  checks:
    name: ${{ matrix.task.name }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    env:
      # HF models downloaded by the HF roundtrip tests are cached here across runs
      # (see the "Cache HuggingFace models" step) to avoid re-downloading every run.
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        task:
          - name: Lint
            run: make lint-check

          - name: Test
            run: |
              pytest -v --color=yes --durations=6 \
                --ignore-glob='src/test/distributed/checkpoint*' \
                --ignore-glob='src/test/train/checkpoint*' \
                --ignore-glob='src/test/nn/transformer*' \
                --ignore-glob='src/test/nn/attention*' \
                --ignore-glob='src/test/examples/*' \
                --ignore-glob='src/test/scripts/*' \
                src/test/

          - name: Test checkpoint
            run: |
              pytest -v --color=yes --durations=3 \
                src/test/distributed/checkpoint* \
                src/test/train/checkpoint*

          - name: Test transformer
            run: |
              pytest -v --color=yes --durations=3 \
                src/test/nn/transformer/

          - name: Test attention
            run: |
              # Note: Exclude tensor parallel tests because they are resource-intensive and we test
              # them on GPU anway.
              pytest -v --color=yes --durations=3 \
                -k 'not tensor_parallel' \
                src/test/nn/attention*

          - name: Test examples
            run: |
              pytest -v --color=yes --durations=3 \
                src/test/examples/

          - name: Test scripts
            run: |
              pytest -v --color=yes --durations=3 \
                src/test/scripts/

          - name: Integration tests
            run: |
              pytest -v --color=yes --durations=3 -m "not gpu" \
                src/integration_tests/

          - name: Type check
            run: make type-check

          - name: Build
            run: make build

          - name: Style
            run: make style-check

          - name: Docs
            run: |
              cd docs && make html SPHINXOPTS="-W --keep-going"

        include:
          - python: "3.10"
            task:
              name: Lint (min Python)
              run: make lint-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
          cache-prefix: ${{ env.CACHE_PREFIX }}

      - name: Setup Google credentials
        run: |
          mkdir -p $HOME/.google
          printenv GOOGLE_CREDENTIALS > $HOME/.google/credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.google/credentials.json" >> $GITHUB_ENV

      - name: Restore mypy cache
        if: matrix.task.name == 'Type check'
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-${{ github.ref }}
            mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}

      - name: Cache HuggingFace models
        # The "Test" task runs the HF roundtrip tests, which download Qwen3-0.6B and
        # Gemma-3-270m. Persist HF_HOME so they're only downloaded once. Bump the key
        # suffix when the set of models pulled by these tests changes.
        if: matrix.task.name == 'Test'
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ env.CACHE_PREFIX }}-${{ runner.os }}-qwen3-0.6b-gemma3-270m

      - name: ${{ matrix.task.name }}
        run: |
          ${{ matrix.task.run }}

      - name: Upload package distribution files
        if: matrix.task.name == 'Build'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist

  gpu_checks:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GANTRY_GITHUB_TESTING: "true" # force better logging for CI
    strategy:
      fail-fast: false
      matrix:
        # TODO: Add GPU test coverage for PyTorch 2.12 with CUDA 13.0 once a compatible
        # Beaker image is available.
        task:
          - name: Test (GPU)
            image: &gpu_test_image akshitab/olmo-core-tch2100cu128-sm80-2026-08-25
            gpus: 2
            gpu_types: --gpu-type h100 --gpu-type a100
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                --ignore-glob='src/test/distributed/checkpoint*' \
                --ignore-glob='src/test/nn/transformer*' \
                --ignore-glob='src/test/nn/attention*' \
                --ignore-glob='src/test/nn/moe*' \
                --ignore-glob='src/test/optim*' \
                src/test/

          - name: Test (GPU, torch 2.11)
            image: akshitab/olmo-core-tch2110cu128-2026-08-28
            gpus: 2
            gpu_types: --gpu-type h100
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                --ignore-glob='src/test/distributed/checkpoint*' \
                --ignore-glob='src/test/nn/transformer*' \
                --ignore-glob='src/test/nn/attention*' \
                --ignore-glob='src/test/nn/moe*' \
                --ignore-glob='src/test/nn/ddp*' \
                --ignore-glob='src/test/optim*' \
                --ignore-glob='src/test/kernels*' \
                --ignore-glob='src/test/train/train_module/transformer/ddp_train_module*' \
                src/test/

          - name: Test checkpoint (GPU)
            image: *gpu_test_image
            gpus: 2
            gpu_types: --gpu-type h100 --gpu-type a100
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                src/test/distributed/checkpoint*

          - name: Test transformer (GPU)
            image: *gpu_test_image
            gpus: 2
            gpu_types: --gpu-type h100 --gpu-type a100
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                src/test/nn/transformer*

          - name: Test attention (GPU)
            image: *gpu_test_image
            gpus: 2
            gpu_types: --gpu-type h100
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                src/test/nn/attention*

          - name: Test MoE (GPU)
            image: *gpu_test_image
            gpus: 2
            # The v1 dropless MoE tests use the grouped_gemm CUTLASS kernels, which have no
            # Blackwell (sm_100) build, so keep this job off b200.
            gpu_types: --gpu-type h100 --gpu-type a100
            # The v2 MoE GPU tests need TransformerEngine + torch 2.10, which this image
            # lacks, so they run in the "Test MoE kernels" job below; exclude them here.
            # (The fused block/model tests moved to src/test/nn/ddp, which this job's
            # src/test/nn/moe glob doesn't reach, so only src/test/nn/moe/v2 needs excluding.)
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                --ignore-glob='src/test/nn/moe/v2*' \
                src/test/nn/moe*

          - name: Test optim (GPU)
            image: *gpu_test_image
            gpus: 2
            gpu_types: --gpu-type h100 --gpu-type a100
            run: |
              pytest -v --color=yes --durations=3 -m gpu \
                src/test/optim*

          - name: Integration tests (GPU)
            image: *gpu_test_image
            gpus: 2
            gpu_types: --gpu-type h100 --gpu-type a100
            run: |
              pytest -v --color=yes -m gpu \
                src/integration_tests/

          # The MoE kernels require torch >= 2.10 (torch.nn.functional.grouped_mm,
          # F.ScalingType/F.SwizzleType) and JIT-build .cu extensions, so they need an
          # image with both torch 2.10 and the CUDA toolkit (nvcc). Their tests are
          # version-gated and skip on the torch 2.9 image above. The fused MoE-v2 GPU tests
          # (src/test/nn/ddp for the block/model, src/test/nn/moe/v2 for the EP primitives) also
          # run here since they need TransformerEngine + the same custom kernels, which the torch
          # 2.9 image lacks.
          - name: Test MoE kernels (GPU, torch 2.10)
            image: akshitab/olmo-core-tch2100cu128-rma-2026-07-08
            gpus: 2
            # This image's kernels (grouped_gemm, symm_mem_vdev2d, FP8) are built for sm_90 only
            # (`-gencode arch=compute_90,code=sm_90`), so pin to h100 — on a100/b200 grouped_gemm
            # fails with "Grouped GEMM execution not possible with HW".
            gpu_types: --gpu-type h100
            # Build the NVSHMEM symm_mem_vdev2d ext (compiled out-of-tree; needs an image with
            # NVSHMEM + CUDA toolkit) before pytest, so the rowwise-EP tests that import the built
            # module at collection time can run. One `bash -c` so both run inside the gantry container.
            run: |
              bash -c 'python -m olmo_core.kernels.build_symm_mem_vdev2d_ext --inplace && pytest -v --color=yes --durations=3 -m gpu src/test/kernels/ src/test/nn/ddp/ src/test/nn/moe/v2/ src/test/nn/moe/moe_test.py src/test/nn/moe/routed_experts_v2_test.py src/test/train/train_module/transformer/ddp_train_module_test.py'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }} # check out PR head commit instead of merge commit

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          # Pin an explicit uv version so setup-uv resolves from its bundled manifest instead of
          # querying the GitHub "latest release" API. The GPU matrix launches many jobs at once and
          # the concurrent unauthenticated lookups were intermittently rate-limited, failing the jobs
          # in the setup step with "Github API request failed while getting latest release".
          version: "0.11.29"

      - name: Install Gantry
        run:
          # uv tool install git+https://github.com/allenai/beaker-gantry
          uv tool install 'beaker-gantry>=3.4.5,<4.0'

      - name: Determine Beaker workspace
        if: env.BEAKER_TOKEN != ''
        run: |
          echo "BEAKER_WORKSPACE=$(make get-beaker-workspace)" >> $GITHUB_ENV

      - name: Determine current commit SHA (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.head_ref }}" >> $GITHUB_ENV

      - name: Determine current commit SHA (push)
        if: github.event_name != 'pull_request'
        run: |
          echo "COMMIT_SHA=$GITHUB_SHA" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: GPU Tests
        if: env.BEAKER_TOKEN != ''
        run: |
          exec gantry run \
            --show-logs \
            --yes \
            --workspace ai2/OLMo-core \
            --description 'OLMo-core ${{ matrix.task.name }}' \
            --ref ${{ env.COMMIT_SHA }} \
            --branch ${{ env.BRANCH_NAME }} \
            --beaker-image ${{ matrix.task.image }} \
            --pre-setup 'python -m pip uninstall -y torchaudio' \
            --budget ai2/oe-other \
            --priority normal \
            --min-runtime 0 \
            --gpus ${{ matrix.task.gpus }} \
            --task-timeout 15m \
            --host-networking \
            ${{ matrix.task.gpu_types || '--gpu-type h100 --gpu-type a100 --gpu-type b200' }} \
            --system-python \
            --dataset-secret 'GOOGLE_CREDENTIALS:/.google/credentials.json' \
            --env 'GOOGLE_APPLICATION_CREDENTIALS=/.google/credentials.json' \
            --env 'TOKENIZERS_PARALLELISM=false' \
            --env 'CUBLAS_WORKSPACE_CONFIG=:16:8' \
            --env-secret 'AWS_ACCESS_KEY_ID=olmocore_AWS_ACCESS_KEY_ID' \
            --env-secret 'AWS_SECRET_ACCESS_KEY=olmocore_AWS_SECRET_ACCESS_KEY' \
            -- ${{ matrix.task.run }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [checks]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"
          cache-prefix: ${{ env.CACHE_PREFIX }}

      - name: Prepare environment
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download package distribution files
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Generate release notes
        run: |
          python src/scripts/release/release_notes.py > ${{ github.workspace }}-RELEASE_NOTES.md

      - name: Publish package to PyPI
        run: |
          twine upload --verbose -u __token__ -p '${{ secrets.PYPI_TOKEN }}' dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: ${{ github.workspace }}-RELEASE_NOTES.md
          prerelease: ${{ contains(env.TAG, 'rc') }}
          files: |
            dist/*

      - name: Add PR comments on release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./src/scripts/release/add_pr_comments_on_release.sh

      - name: Send Slack notifications about release
        continue-on-error: true
        run: |
          python ./src/scripts/release/slack_notification.py '${{ secrets.SLACK_WEBHOOK_URL}}'
