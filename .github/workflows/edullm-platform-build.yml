name: Build eduLLM research image

# A thin caller and nothing else. Every decision that matters lives in edu-llm/platform;
# this file exists to satisfy the two obligations a call site cannot inherit, and to say
# when a build is allowed to fire. Both obligations fail as an AssumeRole denial that
# reads like a broken role ARN rather than like its cause:
#
#   1. `id-token: write` has to be granted on the calling job below. A called workflow can
#      only downgrade the permissions its caller hands it, so the id-token grant on the
#      platform's publish job cannot create itself.
#   2. The `uses:` reference has to be `@main`. The publisher role's trust policy matches
#      job_workflow_ref with StringEquals against `@refs/heads/main`, so a SHA-pinned or
#      tag-pinned reference mints a claim the role will never accept. This is the one
#      place where pinning a ref makes things worse rather than better.
on:
  workflow_dispatch:
  # A deliberate opt-in namespace rather than every branch. This repository has 29 people
  # with write access and an unrelated eduLLM automation family already running here, and
  # every accepted push spends runner time and publishes an immutable ECR tag that cannot
  # be rewritten, so a build fires only from a branch whose name says it was meant to.
  # push and workflow_dispatch are also the only events the reusable workflow accepts: on
  # anything else github.ref names the default branch rather than the pushed commit, so
  # the run would publish something other than what the caller meant.
  #
  # main is here for the opposite reason to the namespace, not as an exception to it. The
  # platform's submission form takes a branch name and resolves it to a commit, and refuses
  # a commit with no published image. So every merge to main that nobody happened to build
  # leaves the most obvious thing a researcher can type failing for a reason that names the
  # image rather than the merge. Volume is not the objection the namespace was answering:
  # main is protected and receives reviewed merges, not the 29 people's working branches.
  push:
    branches:
      - "edullm/**"
      - main

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: edu-llm/platform/.github/workflows/build-research-image.yml@main
    with:
      repository: OLMo-core
      publisher_role_arn: ${{ vars.AWS_ECR_PUBLISHER_ROLE_ARN }}
      # Runs in the platform's gate job, which holds no AWS identity and only
      # `contents: read`. That is precisely why code chosen by whoever pushed the branch
      # is acceptable here: it runs before anything can reach AWS, with nothing to steal.
      #
      # This is `ruff check .`, the same check main.yml already enforces through
      # `make lint-check`, pinned to the version pyproject's dev extra pins. It is
      # honestly narrower than the repository's own suite, and it has to be:
      # src/test/conftest.py imports torch at module scope, so pytest cannot collect any
      # subtree beneath src/test without a multi-gigabyte install, and this gate runs on
      # the runner rather than inside the built image, so nothing is installed for it.
      # Lint still reaches 440 of the 441 Python files in the checkout and fails on
      # undefined names and syntax errors, which are the defects worth blocking an
      # immutable tag over. Formatting is left out deliberately: black and isort pass
      # today, but a cosmetic nit should not be able to stop an image being published.
      #
      # --no-cache keeps .ruff_cache out of the checkout the platform verifies as clean.
      #
      # The second command is not this repository's own test. It holds
      # Checkpointer.dir_is_checkpoint equal to the file list the platform's
      # checkpoints.py copied out of it by hand, and it runs here because this is the one
      # moment the two can start disagreeing: an image built from a commit that changed
      # the rule. Blocking the build is the point. Afterwards the platform would go on
      # refusing checkpoints a resume would load, or promising ones it would not, and
      # nothing would say so.
      #
      # It reads the source rather than importing it, for the same reason the lint above
      # is narrower than the real suite: nothing is installed on this runner and
      # olmo_core.train.checkpoint pulls in torch. The platform is checked out beside this
      # repository by the reusable workflow and its lockfile is already synced, which is
      # what makes the invocation a single line.
      test_command: |
        lint_venv="$(mktemp -d)/ruff"
        python3 -m venv "${lint_venv}"
        "${lint_venv}/bin/pip" install --quiet --disable-pip-version-check ruff==0.15.22
        "${lint_venv}/bin/ruff" check --no-cache .
        (cd "${GITHUB_WORKSPACE}/platform" && uv run --frozen python \
          tools/verify_checkpoint_shape_agreement.py \
          --olmo-core-root "${GITHUB_WORKSPACE}/source")
