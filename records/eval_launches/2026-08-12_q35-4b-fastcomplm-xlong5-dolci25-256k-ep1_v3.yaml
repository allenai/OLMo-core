# ---- DEVIATIONS FROM THE run-evals SKILL, recorded deliberately ----
deviations:
  - >-
    eval_version is v3, not v2. The skill says the eval set is standardized on
    _eval_bundle_eval500_v2_clean; this launch deliberately overrides CONTRADICTION ONLY to the
    realistic-mode v3 bundle. Every other task still reads v2_clean, so only contradiction rows
    are non-comparable to prior v2 numbers.
  - >-
    The skill states v2 is the only supported ladder. v3 support was added and pushed in 79b969c01;
    the skill text predates it and should be updated.
  - >-
    cluster is ai2/saturn, not ai2/jupiter-cirrascale-2; jupiter was at 902/902 slots (0 free)
    with strict-priority/unallocated-only-backfill, so urgent jobs could not schedule at all.
    Saturn is eager with A100-80GB, which also satisfies the >=256k 80GB requirement.
  - >-
    The skill's --eval-tag and --xlong-only flags DO NOT EXIST in the launcher or the on-node
    runner (0 occurrences of either, or of EVAL_TAG/XLONG_ONLY). --results-dir -> EVAL_OUT_DIR is
    used instead for collision avoidance. Consequence: the xlong passes will ALSO re-run 2k-32k at
    bs=1, which is wasted GPU but not a wrong number. No supported way to suppress it today.
  - >-
    Pass B is contra-only rather than the skill's contra,nq,outlier,rerank,oolong: the v3 change
    touches contradiction only, and these checkpoints already have v2 xlong rows for the other
    four, so including them would duplicate rather than measure.
  - >-
    make_yarn_copy.py takes --serving-copy (a vLLM serving dir), not --src <step> as the skill
    shows; the yarn2 copies here are built by patching the olmo-core config.json rope scaling.

