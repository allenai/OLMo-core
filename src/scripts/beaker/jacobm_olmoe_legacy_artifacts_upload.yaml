version: v2
description: Preserve Jacob OLMoE3 legacy HF exports and eval outputs in GCS
tasks:
  - name: hf-legacy-exports
    image:
      beaker: 01KW8G8JC20H11Y60PPTE2VN4Q
    command: [/bin/bash, -lc]
    arguments:
      - |
        set -euo pipefail
        SOURCE_REPO=/weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core
        STATUS_ROOT=/weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/migration-status/legacy-artifacts
        mkdir -p /results /tmp/google "${STATUS_ROOT}"
        CREDENTIALS=/tmp/google/credentials.json
        umask 077
        printenv GANTRY_GOOGLE_CREDENTIALS > "${CREDENTIALS}"
        export GOOGLE_APPLICATION_CREDENTIALS="${CREDENTIALS}"
        unset GANTRY_GOOGLE_CREDENTIALS
        gcloud auth login --cred-file="${CREDENTIALS}" --quiet
        python "${SOURCE_REPO}/src/scripts/upload_legacy_olmoe_artifacts.py" \
          --label hf_legacy_exports \
          --source /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/hf-checkpoints \
          --destination gs://ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp-converted/v1/hf/legacy_exports/ \
          --manifest-destination gs://ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp-converted/v1/manifests/ \
          --status-dir "${STATUS_ROOT}" \
          2>&1 | tee /results/hf_legacy_exports.log
    envVars:
      - name: GANTRY_GOOGLE_CREDENTIALS
        secret: jacobm_GOOGLE_CREDENTIALS
    datasets:
      - mountPath: /weka/oe-adapt-default
        source:
          weka: oe-adapt-default
      - mountPath: /weka/oe-training-default
        source:
          weka: oe-training-default
    result:
      path: /results
    resources:
      cpuCount: 16
      memory: 32 GiB
    context:
      priority: urgent
      minRuntime: 8h0m0s
      autoResume: false
    constraints:
      cluster:
        - ai2/holmes
    hostNetworking: true
    propagateFailure: false
    propagatePreemption: false
    timeout: 72h0m0s

  - name: eval-legacy-outputs
    image:
      beaker: 01KW8G8JC20H11Y60PPTE2VN4Q
    command: [/bin/bash, -lc]
    arguments:
      - |
        set -euo pipefail
        SOURCE_REPO=/weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core
        STATUS_ROOT=/weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/migration-status/legacy-artifacts
        mkdir -p /results /tmp/google "${STATUS_ROOT}"
        CREDENTIALS=/tmp/google/credentials.json
        umask 077
        printenv GANTRY_GOOGLE_CREDENTIALS > "${CREDENTIALS}"
        export GOOGLE_APPLICATION_CREDENTIALS="${CREDENTIALS}"
        unset GANTRY_GOOGLE_CREDENTIALS
        gcloud auth login --cred-file="${CREDENTIALS}" --quiet
        python "${SOURCE_REPO}/src/scripts/upload_legacy_olmoe_artifacts.py" \
          --label eval_legacy_outputs \
          --source /weka/oe-training-default/ai2-llm/evals/jacobm/olmoe3 \
          --destination gs://ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp-converted/v1/evals/legacy_outputs/ \
          --manifest-destination gs://ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp-converted/v1/manifests/ \
          --status-dir "${STATUS_ROOT}" \
          2>&1 | tee /results/eval_legacy_outputs.log
    envVars:
      - name: GANTRY_GOOGLE_CREDENTIALS
        secret: jacobm_GOOGLE_CREDENTIALS
    datasets:
      - mountPath: /weka/oe-adapt-default
        source:
          weka: oe-adapt-default
      - mountPath: /weka/oe-training-default
        source:
          weka: oe-training-default
    result:
      path: /results
    resources:
      cpuCount: 8
      memory: 16 GiB
    context:
      priority: urgent
      minRuntime: 1h0m0s
      autoResume: false
    constraints:
      cluster:
        - ai2/holmes
    hostNetworking: true
    propagateFailure: false
    propagatePreemption: false
    timeout: 24h0m0s
