schema_version: 1

experiment:
  description: Full final-checkpoint validation for completed 810M V1 long-context runs
  checkpoint_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/long-context

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core
  wrapper: src/scripts/train/jacobm_olmoe3_long_context_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  min_runtime: 10m
  auto_resume: true
  timeout: 24h0m0s
  result_path: /results

secrets:
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

evaluation:
  task_set: full
  sequence_length: 65536
  eval_sequence_length: 8192
  global_batch_size: 4194304
  max_tokens: 100000000000
  save_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/eval-backfills/long-context
  work_dir: /weka/oe-training-default/ai2-llm/checkpoints/yashasbls/dataset-cache
  data_glob: /weka/oe-training-default/ai2-llm/preprocessed/tylerr/lc-reshard-final-cleaned/v0.1/allenai/dolma2-tokenizer/*.npy

targets:
  - source_run: lc-810m-integration-wide-cx8-mt4e-5-lc2e-5-64k-r1
    step: step23842
    model_size: 810m
    family: integration_wide
    gpu_count: 8
    expert_parallel_size: 1
    expert_parallel_path: sync_1d
    rank_microbatch_sequences: 1
  - source_run: lc-810m-baseline-cx8-mt4e-5-lc2e-5-64k-r1
    step: step23842
    model_size: 810m
    family: baseline
    gpu_count: 8
    expert_parallel_size: 1
    expert_parallel_path: sync_1d
    rank_microbatch_sequences: 1
