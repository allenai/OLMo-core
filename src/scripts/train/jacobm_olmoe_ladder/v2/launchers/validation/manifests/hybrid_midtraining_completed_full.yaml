  sequence_length: 8192
  rank_microbatch_sequences: 4
  save_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/eval-backfills/midtraining
  batch_sizes:
    8: 1048576

