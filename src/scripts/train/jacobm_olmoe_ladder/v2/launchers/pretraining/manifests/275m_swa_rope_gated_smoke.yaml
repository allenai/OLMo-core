schema_version: 1

experiment:
  description: Checkpoint-free functional gate for the 275M geometry SWA RoPE-gated control
  checkpoint_root: /tmp/olmoe3-275m-swa-rope-gated-functional

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_hybrid_scale_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  min_runtime: 0m
  auto_resume: true
  timeout: 2h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  model_size: 275m
  model_variant: geometry_275m_swa_rope_gated
  sequence_length: 8192
  global_batch_size: 262144
  rank_microbatch_sequences: 16
  learning_rate: "8e-4"
  chinchilla_multiple: 1
  hard_stop_steps: 12
  checkpoints: false
  evals: false
  compile: true
  wandb: true

runs:
  - {task_name: swa-functional-gpu1-mb16, run_name: smoke-moe-v2-core-275m-swa-rope-gated-functional-gpu1-mb16-r1, gpu_count: 1, expert_parallel_size: 1, expert_parallel_path: sync_1d}
