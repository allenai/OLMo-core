schema_version: 1

experiment:
  description: 810M KDA LatentMoE L=4 1,000-expert Cx4 transferred-LR control
  checkpoint_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/pretraining

source:
  remote: https://github.com/allenai/OLMo-core
  branch: jacobm/moe-v2-core-gdn2
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128GiB
  min_runtime: 4h
  auto_resume: true
  timeout: 168h

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

weka:
  - {bucket: oe-adapt-default, mount: /weka/oe-adapt-default}
  - {bucket: oe-training-default, mount: /weka/oe-training-default}

training:
  model_variant: geometry_matched_kda_ev2_neg_nope_gated_latent4x_1000experts
  layout_profile: kda_810m_cx4
  capacity_qualified_model_sizes: [810m]
  sequence_length: 8192
  hard_stop_steps: 0
  checkpoints: true
  save_interval: 999999999
  ephemeral_save_interval: 500
  checkpoint_removal: ephemeral_only
  evals: false
  eval_interval: 999999999
  compile: true
  wandb: true

runs:
  - {task_name: 810m-l4-1000e-cx4-holmes, run_name: pt-810m-kda-ev2-neg-nope-gated-latentmoe-l4-1000e-cx4-lr4e-4-r1, model_size: 810m, cx: 4, learning_rate: "4e-4", global_batch_size: 524288, num_nodes: 2, gpus_per_node: 8, expert_parallel_size: 1, rank_microbatch_sequences: 4}
