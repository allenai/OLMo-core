schema_version: 1

experiment:
  description: Checkpoint-free 275M geometry GDN2 RoPE-gated 2M/4M parallelism matrix
  checkpoint_root: /tmp/olmoe3-275m-gdn2-rope-gated-parallelism

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_gdn2_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  min_runtime: 0m
  auto_resume: true
  timeout: 5h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  model_size: 275m
  model_variant: geometry_275m_gdn2_ev2_rope_gated
  sequence_length: 8192
  global_batch_size: 2097152
  rank_microbatch_sequences: 16
  learning_rate: "8e-4"
  chinchilla_multiple: 1
  hard_stop_steps: 50
  checkpoints: false
  evals: false
  compile: true
  wandb: true

# Exact GDN1/SWA comparison matrix. Submit after the capacity gate confirms
# MB16. EP-default cells use the upstream code defaults; reduce-scatter cells
# differ from their EP1 controls only in DDP gradient synchronization.
runs:
  - {task_name: b2m-gpu2-ep1, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu2-ep1-r1, gpu_count: 2, expert_parallel_size: 1, expert_parallel_path: sync_1d}
  - {task_name: b2m-gpu4-ep1, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu4-ep1-r1, gpu_count: 4, expert_parallel_size: 1, expert_parallel_path: sync_1d}
  - {task_name: b2m-gpu8-ep1, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu8-ep1-r1, gpu_count: 8, expert_parallel_size: 1, expert_parallel_path: sync_1d}
  - {task_name: b2m-gpu2-ep2-default, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu2-ep2-default-r1, gpu_count: 2, expert_parallel_size: 2, expert_parallel_use_code_defaults: true}
  - {task_name: b2m-gpu4-ep4-default, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu4-ep4-default-r1, gpu_count: 4, expert_parallel_size: 4, expert_parallel_use_code_defaults: true}
  - {task_name: b2m-gpu8-ep8-default, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu8-ep8-default-r1, gpu_count: 8, expert_parallel_size: 8, expert_parallel_use_code_defaults: true}
  - {task_name: b2m-gpu4-ep1-rs, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu4-ep1-rs-r1, gpu_count: 4, expert_parallel_size: 1, expert_parallel_path: sync_1d, data_parallel_use_reduce_scatter: true}
  - {task_name: b2m-gpu8-ep1-rs, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b2m-gpu8-ep1-rs-r1, gpu_count: 8, expert_parallel_size: 1, expert_parallel_path: sync_1d, data_parallel_use_reduce_scatter: true}
  - {task_name: b4m-gpu2-ep1, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu2-ep1-r1, global_batch_size: 4194304, gpu_count: 2, expert_parallel_size: 1, expert_parallel_path: sync_1d}
  - {task_name: b4m-gpu4-ep1, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu4-ep1-r1, global_batch_size: 4194304, gpu_count: 4, expert_parallel_size: 1, expert_parallel_path: sync_1d}
  - {task_name: b4m-gpu8-ep1, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu8-ep1-r1, global_batch_size: 4194304, gpu_count: 8, expert_parallel_size: 1, expert_parallel_path: sync_1d}
  - {task_name: b4m-gpu2-ep2-default, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu2-ep2-default-r1, global_batch_size: 4194304, gpu_count: 2, expert_parallel_size: 2, expert_parallel_use_code_defaults: true}
  - {task_name: b4m-gpu4-ep4-default, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu4-ep4-default-r1, global_batch_size: 4194304, gpu_count: 4, expert_parallel_size: 4, expert_parallel_use_code_defaults: true}
  - {task_name: b4m-gpu8-ep8-default, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu8-ep8-default-r1, global_batch_size: 4194304, gpu_count: 8, expert_parallel_size: 8, expert_parallel_use_code_defaults: true}
  - {task_name: b4m-gpu4-ep1-rs, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu4-ep1-rs-r1, global_batch_size: 4194304, gpu_count: 4, expert_parallel_size: 1, expert_parallel_path: sync_1d, data_parallel_use_reduce_scatter: true}
  - {task_name: b4m-gpu8-ep1-rs, run_name: smoke-moe-v2-core-275m-gdn2-rope-gated-b4m-gpu8-ep1-rs-r1, global_batch_size: 4194304, gpu_count: 8, expert_parallel_size: 1, expert_parallel_path: sync_1d, data_parallel_use_reduce_scatter: true}
