schema_version: 1

experiment:
  description: 275M canonical KDA reference-kernel correctness and MB16 training smoke
  checkpoint_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/pretraining

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_kda_smoke_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  min_runtime: 0m
  auto_resume: true
  timeout: 8h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  sequence_length: 8192
  hard_stop_steps: 50
  checkpoints: false
  save_interval: 999999999
  ephemeral_save_interval: 999999999
  checkpoint_removal: never
  evals: false
  eval_interval: 999999999
  eval_steps: 0
  eval_task_set: hellaswag
  eval_on_finish: false
  compile: true
  wandb: true

runs:
  - task_name: kda-reference-mb16-2m
    run_name: smoke-275m-geometry-kda-ev1-noneg-nope-gated-mb16-2m-r1
    model_variant: geometry_275m_kda_ev1_noneg_nope_gated
    model_size: 275m
    cx: 1
    learning_rate: "1.6e-3"
    global_batch_size: 2097152
    gpu_count: 1
    expert_parallel_size: 1
    expert_parallel_path: rowwise_nvshmem
    rank_microbatch_sequences: 16
