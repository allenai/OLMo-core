schema_version: 1

experiment:
  description: Checkpoint-free capacity smokes for 275M geometry GDN expand_v=2 NoPE attention gating
  checkpoint_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/pretraining

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_geometry_275m_nope_gated_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  # Explicitly authorized as unallocated work on 2026-07-18.
  min_runtime: 0m
  auto_resume: true
  timeout: 2h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  sequence_length: 8192
  hard_stop_steps: 11
  checkpoints: false
  save_interval: 999999999
  ephemeral_save_interval: 999999999
  checkpoint_removal: never
  evals: false
  eval_interval: 999999999
  eval_steps: 0
  eval_task_set: hellaswag
  eval_on_finish: false
  compile: true
  wandb: false

# Exercise the largest selected microbatch for each canonical optimizer batch.
# A single LR is sufficient because capacity does not depend on the LR.
runs:
  - task_name: cx1-mb8
    run_name: smoke-275m-geometry-gdn-ev2-nope-gated-cx1-mb8
    model_size: 275m
    cx: 1
    learning_rate: "8e-4"
    global_batch_size: 262144
    gpu_count: 4
    expert_parallel_size: 1
    rank_microbatch_sequences: 8
  - task_name: cx2-mb12
    run_name: smoke-275m-geometry-gdn-ev2-nope-gated-cx2-mb12
    model_size: 275m
    cx: 2
    learning_rate: "8e-4"
    global_batch_size: 393216
    gpu_count: 4
    expert_parallel_size: 1
    rank_microbatch_sequences: 12
  - task_name: cx4-mb16
    run_name: smoke-275m-geometry-gdn-ev2-nope-gated-cx4-mb16
    model_size: 275m
    cx: 4
    learning_rate: "8e-4"
    global_batch_size: 524288
    gpu_count: 4
    expert_parallel_size: 1
    rank_microbatch_sequences: 16
  - task_name: cx8-mb12
    run_name: smoke-275m-geometry-gdn-ev2-nope-gated-cx8-mb12
    model_size: 275m
    cx: 8
    learning_rate: "8e-4"
    global_batch_size: 786432
    gpu_count: 8
    expert_parallel_size: 1
    rank_microbatch_sequences: 12
