schema_version: 1

experiment:
  description: Checkpoint-free larger GDN2 gated-NoPE production-layout qualification
  checkpoint_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/smokes

source:
  remote: https://github.com/allenai/OLMo-core
  branch: jacobm/moe-v2-core-gdn2
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128GiB
  min_runtime: 0m
  preemptible: false
  auto_resume: false
  timeout: 2h

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

weka:
  - {bucket: oe-adapt-default, mount: /weka/oe-adapt-default}
  - {bucket: oe-training-default, mount: /weka/oe-training-default}

training:
  model_variant: geometry_matched_gdn2_ev2_nope_gated
  sequence_length: 8192
  hard_stop_steps: 50
  checkpoints: false
  evals: false
  compile: true
  wandb: true

runs:
  - {wave: 1, task_name: 480m-mb8-w8, run_name: smoke-480m-geometry-gdn2-ev2-nope-gated-mb8-w8-r1, model_size: 480m, cx: 4, learning_rate: "8e-4", global_batch_size: 524288, num_nodes: 1, gpus_per_node: 8, expert_parallel_size: 1, rank_microbatch_sequences: 8}
  - {wave: 1, task_name: 480m-mb6-w16, run_name: smoke-480m-geometry-gdn2-ev2-nope-gated-mb6-w16-r1, model_size: 480m, cx: 8, learning_rate: "8e-4", global_batch_size: 786432, num_nodes: 2, gpus_per_node: 8, expert_parallel_size: 1, rank_microbatch_sequences: 6}
  - {wave: 1, task_name: 810m-mb6-w16, run_name: smoke-810m-geometry-gdn2-ev2-nope-gated-mb6-w16-r1, model_size: 810m, cx: 8, learning_rate: "4e-4", global_batch_size: 786432, num_nodes: 2, gpus_per_node: 8, expert_parallel_size: 1, rank_microbatch_sequences: 6}
