schema_version: 1

experiment:
  description: Unallocated replacement for the 480M Cx8 active-matched GDN hybrid run
  checkpoint_root: /weka/oe-training-default/ai2-llm/checkpoints/jacobm/olmoe3/olmo-ddp/pretraining

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_hybrid_scale_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 64 GiB
  # Explicitly authorized for this replacement launch on 2026-07-16.
  min_runtime: 0m
  auto_resume: true
  timeout: 168h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN
  HF_TOKEN: jacobm_HF_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  sequence_length: 8192
  hard_stop_steps: 0
  save_interval: 999999999
  ephemeral_save_interval: 500
  checkpoint_removal: ephemeral_only
  evals: false
  eval_interval: 2000
  eval_steps: 0
  eval_task_set: full
  eval_on_finish: false
  compile: true
  wandb: true

runs:
  - task_name: 480m-cx8
    # Keep the original resume-stable run/checkpoint identity. The allocated
    # predecessor never started and wrote no checkpoint.
    run_name: 480m-intwide-hybrid-gdn-ev1-cx8-lr8e-4
    model_size: 480m
    cx: 8
    learning_rate: "8e-4"
    global_batch_size: 786432
    gpu_count: 8
    expert_parallel_size: 1
    rank_microbatch_sequences: 12
