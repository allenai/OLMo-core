schema_version: 1

experiment:
  description: Largest-legal-microbatch smokes for the 275M geometry GDN expand_v=2 model
  checkpoint_root: /tmp/olmoe3-geometry-gdn-ev2-smokes

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core
  wrapper: src/scripts/train/jacobm_olmoe3_geometry_275m_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 64 GiB
  # This intervention is explicitly authorized to use the unallocated queue.
  # minRuntime=0 makes the tasks immediately interruptible; autoResume asks
  # Beaker to requeue them after an interruption.
  min_runtime: 0m
  auto_resume: true
  timeout: 4h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  sequence_length: 8192
  hard_stop_steps: 12
  checkpoints: false
  save_interval: 999999999
  ephemeral_save_interval: 999999999
  checkpoint_removal: never
  evals: false
  eval_interval: 999999999
  eval_steps: 0
  eval_task_set: hellaswag
  eval_on_finish: false
  compile: true
  wandb: true

# The first launch selects only the largest legal microbatch for each Cx. The
# remaining rows are pre-audited fallbacks and are submitted only after an OOM.
runs:
  - task_name: cx1-mb16
    run_name: smoke-275m-geometry-gdn-ev2-cx1-mb16-r1
    model_size: 275m
    cx: 1
    learning_rate: "1.6e-3"
    global_batch_size: 262144
    gpu_count: 2
    expert_parallel_size: 1
    rank_microbatch_sequences: 16
  - task_name: cx1-mb8
    run_name: smoke-275m-geometry-gdn-ev2-cx1-mb8-r1
    model_size: 275m
    cx: 1
    learning_rate: "1.6e-3"
    global_batch_size: 262144
    gpu_count: 2
    expert_parallel_size: 1
    rank_microbatch_sequences: 8
  - task_name: cx2-mb24
    run_name: smoke-275m-geometry-gdn-ev2-cx2-mb24-r1
    model_size: 275m
