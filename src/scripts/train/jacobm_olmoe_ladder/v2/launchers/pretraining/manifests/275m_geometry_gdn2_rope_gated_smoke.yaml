schema_version: 1

experiment:
  description: Checkpoint-free 275M geometry GDN2 RoPE-gated compiled smoke
  checkpoint_root: /tmp/olmoe3-275m-gdn2-rope-gated-smoke

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_gdn2_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  min_runtime: 0m
  auto_resume: false
  timeout: 3h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  model_variant: geometry_275m_gdn2_ev2_rope_gated
  sequence_length: 8192
  hard_stop_steps: 6
  save_interval: 1000
  ephemeral_save_interval: 500
  checkpoint_removal: never
  eval_interval: 1000
  eval_steps: 0
  eval_task_set: hellaswag
  eval_on_finish: false
  checkpoints: false
  evals: false
  compile: true
  wandb: false

runs:
  - task_name: gdn2-275m-gpu1-ep1-mb1
    run_name: smoke-moe-v2-core-275m-geometry-gdn2-ev2-rope-gated-gpu1-mb1
    model_size: 275m
    learning_rate: "8e-4"
    cx: 1
    global_batch_size: 8192
    gpu_count: 1
    expert_parallel_size: 1
    expert_parallel_path: sync_1d
    rank_microbatch_sequences: 1
