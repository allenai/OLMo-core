schema_version: 1

experiment:
  description: EP1 local-expert MXFP8 qualification for the 672-wide 275M KDA model
  checkpoint_root: /tmp/olmoe3-275m-kda-672-ep1-mxfp8-qualification

source:
  repo: /weka/oe-adapt-default/jacobm/olmoe3/olmo-ddp-migration/OLMo-core-moe-v2-core
  wrapper: src/scripts/train/jacobm_olmoe3_hybrid_scale_beaker.sh
  image: 01KW8G8JC20H11Y60PPTE2VN4Q

beaker:
  workspace: ai2/OLMo-3-moe-experiments
  cluster: ai2/holmes
  priority: urgent
  shared_memory: 128 GiB
  min_runtime: 0m
  auto_resume: false
  timeout: 3h
  result_path: /results

secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  WANDB_API_KEY: jacobm_WANDB_API_KEY
  BEAKER_TOKEN: jacobm_BEAKER_TOKEN

datasets:
  - mount_path: /weka/oe-adapt-default
    weka: oe-adapt-default
  - mount_path: /weka/oe-training-default
    weka: oe-training-default

training:
  model_size: 275m
  model_variant: geometry_275m_kda_ev2_neg_nope_gated_mxfp8_672
  sequence_length: 8192
  global_batch_size: 2097152
  rank_microbatch_sequences: 16
  learning_rate: "8e-4"
  chinchilla_multiple: 1
  hard_stop_steps: 50
  checkpoints: false
  evals: false
  compile: true
  wandb: true
  attention_impl: default
  attention_backend: te

# Both cells use one B300, no expert parallelism, identical data/batch/seed,
# and BF16 KDA/full attention. Only the local MoE expert compute precision
# changes. This is a qualification of the no-EP MXFP8 routing patch, not yet
# the FlashAttention-4 comparison.
runs:
  - task_name: ep1-bf16
    run_name: smoke-275m-kda-672-ep1-bf16-mb16-2m-r2
    gpu_count: 1
    expert_parallel_size: 1
    mxfp8_experts: false
    mxfp8_attention: false

  - task_name: ep1-expert-mxfp8
    run_name: smoke-275m-kda-672-ep1-expert-mxfp8-mb16-2m-r2
    gpu_count: 1
    expert_parallel_size: 1
    mxfp8_experts: true
    mxfp8_attention: false
