version: v2
description: Independent HF-vLLM parity and actual eval smoke; delete only the verified raw scratch copy after all gates pass.
budget: ai2/oe-other
tasks:
  - name: vllm-eval-qualify
    image:
      beaker: 01KY8RWDARD3PR0F1T4ANGFH95
    command: [/bin/bash, -lc]
    arguments:
      - |
        set -euo pipefail
        python - <<'PY'
        import base64,os,subprocess
        env=dict(os.environ)
        header=base64.b64encode(('x-access-token:'+env['GITHUB_TOKEN']).encode()).decode()
        env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+header)
        subprocess.run(['git','clone','--quiet','https://github.com/allenai/scaling-ladders.git','/tmp/hero-ladder'],env=env,check=True)
        PY
        git -C /tmp/hero-ladder checkout --quiet __PLUGINS_REF__
        git clone --quiet https://github.com/allenai/OLMo-core.git /tmp/hero-core
        git -C /tmp/hero-core checkout --quiet __CORE_REF__
        git clone --quiet https://github.com/allenai/olmo-eval.git /tmp/hero-olmo-eval
        git -C /tmp/hero-olmo-eval checkout --quiet 2ce111d32704b9ca454c73286e9ac46dcf0b04ee
        uv venv --python /opt/conda/bin/python /tmp/hero-eval-env
        export PATH=/tmp/hero-eval-env/bin:$PATH
        uv pip install --python /tmp/hero-eval-env/bin/python --index-url https://download.pytorch.org/whl/cu128 'torch==2.10.0' 'torchvision==0.25.0' 'torchaudio==2.10.0'
        uv pip install --python /tmp/hero-eval-env/bin/python 'vllm==0.19.1' 'transformers==5.16.1' 'huggingface_hub<1.29' 'flash-linear-attention==0.5.2' 'datasets==4.8.4' 'torch==2.10.0' 'opencv-python-headless==4.13.0.92' 'torch-c-dlpack-ext' -e /tmp/hero-core -e /tmp/hero-ladder/ladders/olmoe3/vllm_plugin -e /tmp/hero-ladder/ladders/olmoe3/transformers_plugin -e /tmp/hero-olmo-eval
        export TRITON_PTXAS_PATH=/tmp/hero-eval-env/lib/python3.12/site-packages/triton/backends/nvidia/bin/ptxas
        python -c 'import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.get_device_name())'
        cd /tmp/hero-ladder
        python ladders/olmoe3/workloads/hero_hf_vllm_parity.py hf /weka/olmo-3p5-checkpoints/scratch/hero-hf-20260909/__ARM__/step__STEP__/hf
        python ladders/olmoe3/workloads/hero_hf_vllm_parity.py vllm /weka/olmo-3p5-checkpoints/scratch/hero-hf-20260909/__ARM__/step__STEP__/hf
        python ladders/olmoe3/workloads/hero_eval_smoke.py /weka/olmo-3p5-checkpoints/scratch/hero-hf-20260909/__ARM__/step__STEP__/hf

        python /tmp/hero-core/src/examples/olmo_ddp/hero_hf_cleanup.py --arm __ARM__ --step __STEP__
    envVars:
      - name: GITHUB_TOKEN
        secret: jacobm_GITHUB_TOKEN
      - name: HF_TOKEN
        secret: HF_CHECKPOINT_BUCKET_TOKEN
      - name: HF_HUB_DISABLE_PROGRESS_BARS
        value: "1"
      - name: TOKENIZERS_PARALLELISM
        value: "false"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: spawn
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: OMP_NUM_THREADS
        value: "12"
    datasets:
      - mountPath: /weka/olmo-3p5-checkpoints
        source:
          weka: olmo-3p5-checkpoints
    resources:
      gpuCount: 2
      cpuCount: 24
      memory: 192 GiB
      sharedMemory: 16 GiB
    context:
      priority: urgent
      minRuntime: 0
      autoResume: true
    constraints:
      cluster: [ai2/jupiter, ai2/ceres]
    timeout: 6h
