version: v2
description: Verified source staging, conversion, exact tensor roundtrip and full HF qualification; raw scratch retained for eval.
budget: ai2/oe-other
tasks:
  - name: convert-qualify
    image:
      beaker: 01KY8RWDARD3PR0F1T4ANGFH95
    command: [/bin/bash, -lc]
    arguments:
      - |
        set -euo pipefail
        git clone --quiet https://github.com/allenai/OLMo-core.git /tmp/hero-conversion-source
        cd /tmp/hero-conversion-source
        git checkout --quiet __CORE_REF__
        uv venv --python /opt/conda/bin/python /tmp/hero-env
        export PATH=/tmp/hero-env/bin:$PATH
        uv pip install --python /tmp/hero-env/bin/python --index-url https://download.pytorch.org/whl/cu128 'torch==2.10.0'
        uv pip install --python /tmp/hero-env/bin/python -e '.[fla,beaker]' 'torch==2.10.0' 'transformers==5.16.1' 'huggingface_hub==1.29.0' 'accelerate==1.12.0'
        export TRITON_PTXAS_PATH=/tmp/hero-env/lib/python3.12/site-packages/triton/backends/nvidia/bin/ptxas
        python -c 'import torch; print(torch.__version__, torch.version.cuda); assert torch.cuda.is_available(); print(torch.cuda.get_device_name())'
        python src/examples/olmo_ddp/hero_hf_unit_checks.py
        python src/examples/olmo_ddp/hero_hf_stage.py --arm __ARM__ --step __STEP__
        python src/examples/olmo_ddp/hero_hf_convert.py --arm __ARM__ --step __STEP__ --full --portable-reference
    envVars:
      - name: HF_TOKEN
        secret: HF_CHECKPOINT_BUCKET_TOKEN
      - name: OLMO_USE_TORCH_GROUPED_MM
        value: "0"
      - name: HF_HUB_DISABLE_PROGRESS_BARS
        value: "1"
      - name: TOKENIZERS_PARALLELISM
        value: "false"
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: OMP_NUM_THREADS
        value: "12"
    datasets:
      - mountPath: /weka/olmo-3p5-checkpoints
        source:
          weka: olmo-3p5-checkpoints
    resources:
      gpuCount: 2
      cpuCount: 24
      memory: 192 GiB
      sharedMemory: 16 GiB
    context:
      priority: urgent
      minRuntime: 0
      autoResume: true
    constraints:
      cluster: [ai2/jupiter, ai2/ceres]
    timeout: 6h
